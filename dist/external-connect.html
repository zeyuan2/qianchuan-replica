<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千川外网连接设置</title><style>body{max-width:760px;margin:40px auto;padding:0 22px;background:#f4f7fc;color:#23364e;font:15px/1.8 system-ui}section{padding:24px;background:white;border-radius:12px;margin:18px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #ced8e7;border-radius:6px}button{background:#315de2;border:0;border-radius:6px;color:white;padding:10px 20px;cursor:pointer}small{color:#718196}#status{white-space:pre-line}a{color:#315de2}</style><h1>千川外网连接</h1><section><p>访问地址：<b>https://qc.example.com</b><br>仅允许：<b>member2@example.com、member5@example.com、member1@example.com、member4@example.com、member3@example.com</b></p><form id="connect"><label>Cloudflare 隧道安装命令或 Token<input id="command" type="password" autocomplete="off" placeholder="使用Cloudflare页面的复制按钮，粘贴完整内容" required></label><button id="save" type="submit">保存并接通</button></form><p id="message" role="status"></p><small>连接凭据只保存在采集电脑，页面不回显。不要把安装命令发到聊天或群里。</small></section><section><h2>连接状态</h2><p id="status">正在检查…</p><a href="https://qc.example.com" target="_blank" rel="noopener">打开受保护的外网页面</a></section><script>
const $=id=>document.getElementById(id);async function status(){try{const r=await fetch('/api/external/status'),s=await r.json();$('status').textContent='连接凭据：'+(s.configured?'已配置':'等待完整凭据')+'\n安全隧道：'+(s.connected?'已连接':'未连接')+'\n外网登录：QQ邮箱验证码';}catch{$('status').textContent='本机服务暂时不可用';}};
$('connect').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const r=await fetch('/api/external/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:$('command').value})}),j=await r.json();if(!r.ok)throw new Error(j.error?.message||'连接失败');$('command').value='';$('message').textContent=j.message;}catch(e){$('message').textContent=e.message;}finally{$('save').disabled=false;await status();}};status();setInterval(status,5000);
</script></html>
