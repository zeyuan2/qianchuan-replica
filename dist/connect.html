<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千川持续采集连接</title><style>body{max-width:800px;margin:40px auto;padding:0 24px;font:15px/1.8 system-ui;color:#20314d;background:#f4f7fc}section{background:#fff;padding:28px;border-radius:12px;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd6e3;border-radius:5px}button,a.button{display:inline-block;padding:8px 18px;margin:8px 5px 0 0;background:#315de2;color:white;border:0;border-radius:5px;cursor:pointer;text-decoration:none}code{overflow-wrap:anywhere}#status{white-space:pre-wrap}small{color:#738197}.extension-ready{color:#23895c}#extension-connect-slot{padding:14px 18px;border:1px solid #dce5f4;border-radius:8px;background:#f8faff;margin:20px 0}#extension-connect-status{font-size:13px}button:disabled{opacity:.5}details{margin-top:18px}summary{cursor:pointer;color:#72839b}</style><h1>连接千川持续采集</h1><section><ol><li>在 Chrome 登录账户 <b>1000000000000000</b>，并保持“推商品”标签页打开。</li><li>在 Chrome 扩展管理中启用开发者模式，加载目录：<code>D:\qianchuan-replica\bridge-extension</code>。</li><li>扩展加载后，刷新此页面，点击下面的“接通当前浏览器”。</li></ol><div id="extension-connect-slot"><p>尚未检测到只读采集扩展。加载后刷新本页，即可一键接通。</p></div><details><summary>手动配对（备用）</summary><label>本机地址<input value="http://127.0.0.1:5173" readonly></label><label>本机连接码<input id="pair" type="password" readonly></label><button id="copy">复制连接码</button><small>连接码只用于本机配对；千川登录凭据留在浏览器中。</small></details></section><section><h2>采集状态</h2><p id="status">正在读取…</p><button id="capture">立即采集</button><a class="button" href="http://192.168.1.100:8088/" target="_blank">打开内网页面</a><p>服务每5分钟采集一次完整计划列表。相同日期区间共享5分钟查询缓存。</p></section><script>
const $=id=>document.getElementById(id);fetch('/api/pairing').then(r=>r.json()).then(c=>$('pair').value=c.token);
const noticeLink=document.createElement('p');noticeLink.innerHTML='<a class="button" href="/notifications.html">设置微信预算80%提醒</a>';document.querySelector('h1').after(noticeLink);
const connectStyle=document.createElement('style');connectStyle.textContent='#extension-connect{display:none!important}';document.head.append(connectStyle);
const connectActions=document.createElement('div');connectActions.innerHTML='<button id="connect-current" type="button">接通当前浏览器</button><p id="connect-current-status" role="status">只保留当前浏览器作为采集与操作连接；请在同一浏览器打开目标账户商品页。</p>';$('extension-connect-slot').after(connectActions);
$('connect-current').onclick=async()=>{const button=$('extension-connect');if(!button){$('connect-current-status').textContent='此浏览器尚未检测到连接扩展，请使用已安装扩展且已登录千川的 Chrome。';return;}$('connect-current').disabled=true;try{const response=await fetch('/api/pairing',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),data=await response.json();if(!response.ok)throw new Error(data.error?.message||'切换连接失败');const pairing=await(await fetch('/api/pairing')).json();$('pair').value=pairing.token;button.click();$('connect-current-status').textContent='旧浏览器连接已解除，正在连接当前浏览器。请查看上方配对结果。';}catch(error){$('connect-current-status').textContent=error.message;}finally{$('connect-current').disabled=false;}};
const setup=document.createElement('section');setup.innerHTML='<h2>内网操作密码</h2><p>查看数据无需登录；提交计划变更需要此独立密码。仅此采集电脑可设置或重置。重置后所有已登录设备都会退出。</p><form id="operator-setup"><label>新操作密码（6–128个字符）<input id="new-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><label>再输入一次<input id="repeat-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><button type="submit">设置操作密码</button></form><p id="operator-setup-status" role="status"></p><p id="operator-bridge-status"></p>';document.body.insertBefore(setup,document.querySelector('script'));
$('operator-setup').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');if($('new-password').value!==$('repeat-password').value){$('operator-setup-status').textContent='两次密码不一致';return;}button.disabled=true;try{const r=await fetch('/api/operator/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('new-password').value})}),j=await r.json();if(!r.ok)throw new Error(j.error?.message||'设置失败');$('new-password').value='';$('repeat-password').value='';$('operator-setup-status').textContent='操作密码已设置。请在内网页面点击右上角“操作登录”。';}catch(e){$('operator-setup-status').textContent=e.message;}finally{button.disabled=false;}};
async function operatorStatus(){try{const j=await(await fetch('/api/operator/status')).json();$('operator-bridge-status').textContent=j.writeReady?'操作扩展已就绪。每次提交都会先显示变更确认。':'请在 Chrome 扩展管理页重新加载“千川商品本机连接”至1.3.0，再刷新本页。当前只读采集可以继续。';if(!j.configured&&!$('operator-setup-status').textContent)$('operator-setup-status').textContent='尚未设置操作密码';}catch{}}operatorStatus();setInterval(operatorStatus,15000);
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('pair').value);$('copy').textContent='已复制';}catch{$('pair').type='text';$('pair').select();}};
async function status(){try{const r=await fetch('/api/status'),j=await r.json(),m=j.monitor;$('status').textContent=`浏览器连接：${j.bridge.connected?'已接通':'未连接'}\n完整采集：${m.collected}/${m.total??'待查询'} 条\n上次成功：${m.lastSuccessAt?new Date(m.lastSuccessAt).toLocaleString('zh-CN'):'尚未完成'}\n${m.error?.message|| (m.running?'正在采集':'等待下一轮')}`;}catch{$('status').textContent='本机服务未启动';}}
$('capture').onclick=async()=>{const r=await fetch('/api/monitor/refresh',{method:'POST'});const j=await r.json();if(!r.ok)alert(j.error.message);await status();};status();setInterval(status,5000);
</script></html>
